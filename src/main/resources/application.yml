spring:
  application:
    name: smart-parking-lot-system
  datasource:
    url: jdbc:h2:mem:parking;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false

parking:
  seed:
    # Seeds default fee rules (always, idempotent) and a demo lot (only if no floors exist).
    sample-lot: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
